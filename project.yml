name: Folio
options:
  bundleIdPrefix: app.folio
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
targets:
  Folio:
    type: application
    platform: macOS
    sources:
      - path: app/Sources
      - path: app/Generated/nd_core.swift
      - path: app/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: models/face_recognition_sface_2021dec.onnx
        buildPhase: resources
      - path: models/SFace-LICENSE.txt
        buildPhase: resources
    info:
      path: app/Info.plist
      properties:
        CFBundleName: Folio
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: "Folio watches where you're looking so it can tell real study time from drifting. Frames stay in memory and are never saved or sent anywhere."
        NSAppleEventsUsageDescription: "Folio asks your browser for the address of the tab in front, so it can tell a course site from a social one. Nothing leaves this Mac."
    settings:
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folio.Folio
        PRODUCT_NAME: Folio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/app/Generated
        OTHER_LDFLAGS: $(PROJECT_DIR)/core/target/release/libnd_core.a
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust core
        script: '"$PROJECT_DIR/scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
