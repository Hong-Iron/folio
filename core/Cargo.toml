[workspace]
resolver = "2"
members = ["nd-core", "nd-replay", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
uniffi = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tract-onnx = "0.21"

# Keep tests of the face model fast without slowing our own crate's builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
